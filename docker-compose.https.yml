# Opt-in local HTTPS. Never use this developer certificate in production.
services:
  frontend:
    environment:
      LOCAL_HTTPS_ORIGIN: https://localhost:3443
  backend:
    environment:
      AUTH_SESSION_COOKIE_SECURE: "true"
      CSRF_TRUSTED_ORIGINS: '["https://localhost:3443","https://127.0.0.1:3443"]'
  local-https:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3443:443"
      - "[::1]:3443:443"
    volumes:
      - ./ops/local/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local-runtime/tls:/etc/nginx/tls:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks: [app_internal]

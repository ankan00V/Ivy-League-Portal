name: Warehouse Mart Refresh

on:
  schedule:
    - cron: "10 */6 * * *"
  workflow_dispatch:

jobs:
  rebuild-and-gate-marts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      # Postgres, not Mongo. The same correction release-blocking-ml-gates.yml
      # already carries: the app moved to Postgres, this job kept provisioning a
      # Mongo container, and it ran green only because nothing asked it for a
      # DSN. Once seed_release_ml_gate_fixture.py began resolving one it failed
      # on every scheduled run - three in a row before anyone looked, because a
      # cron job that nobody watches fails quietly.
      #
      # pgvector rather than plain postgres: the schema declares
      # CREATE EXTENSION vector alongside pg_trgm.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ivy_league_warehouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: vidyaverse
          CLICKHOUSE_USER: warehouse_ci
          CLICKHOUSE_PASSWORD: warehouse_ci_password
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # sslmode=disable because a CI container speaks plain TCP. Neon carries no
      # sslmode in its DSN and so still defaults to require.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ivy_league_warehouse_ci?sslmode=disable
      POSTGRES_ODM_ENABLED: "true"
      ANALYTICS_WAREHOUSE_CLICKHOUSE_ENABLED: "true"
      ANALYTICS_WAREHOUSE_CLICKHOUSE_HOST: localhost
      ANALYTICS_WAREHOUSE_CLICKHOUSE_PORT: "8123"
      ANALYTICS_WAREHOUSE_CLICKHOUSE_DATABASE: vidyaverse
      ANALYTICS_WAREHOUSE_CLICKHOUSE_USERNAME: warehouse_ci
      ANALYTICS_WAREHOUSE_CLICKHOUSE_PASSWORD: warehouse_ci_password
      ANALYTICS_WAREHOUSE_CLICKHOUSE_SECURE: "false"
      ANALYTICS_WAREHOUSE_ENFORCE_FRESHNESS_IN_PRODUCTION: "true"
      ONLINE_FEATURES_PUBLISH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock.txt

      - name: Apply Postgres schema
        run: |
          for file in backend/migrations/neon/*.sql; do
            echo "applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Seed deterministic warehouse fixture
        run: python backend/scripts/seed_release_ml_gate_fixture.py --days 30 --reset

      # simulated, not real. This job seeds its own deterministic fixture and
      # runs on a CI runner that has never seen a student, so "real" is empty by
      # construction: the parity gate read candidate=0, baseline=0 against a
      # minimum of 200 and failed every six hours. What this job can prove is
      # that the mart machinery computes correctly over known input, which is
      # what 'simulated' means here. Real traffic is answered by
      # real-traffic-rollout-readiness.yml, which reads production and seeds
      # nothing.
      - name: Rebuild analytics warehouse marts
        run: python backend/scripts/rebuild_analytics_warehouse.py --lookback-days 30 --traffic-type simulated

      - name: Enforce mart freshness gate
        run: python backend/scripts/check_warehouse_release_gate.py --json

      - name: Run DS release gates
        run: python backend/scripts/check_ds_release_gates.py --lookback-days 30 --traffic-type simulated --fail-on-not-ready

      - name: Upload warehouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-mart-refresh
          path: |
            backend/benchmarks/ds_release_gates.json
            backend/storage/warehouse/marts
          if-no-files-found: ignore

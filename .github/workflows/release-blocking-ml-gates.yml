name: Release Blocking ML Gates

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  parity-and-champion-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Postgres, not Mongo. The app moved to Postgres, but this job kept
      # provisioning a Mongo container - so the release-blocking gates were
      # seeding and reading a database the app no longer uses, and failed on
      # every push once the DSN resolution stopped guessing.
      #
      # pgvector rather than plain postgres: the schema declares
      # CREATE EXTENSION vector alongside pg_trgm.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ivy_league_release_gate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # sslmode=disable because a CI container speaks plain TCP. Supabase and
      # Neon carry no sslmode and so still default to require.
      SUPABASE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ivy_league_release_gate_ci?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # This job verifies that the gate machinery computes correctly. It seeds its
      # own deterministic data, so every gate below runs over SIMULATED traffic and
      # proves nothing about how real students behave. The real-traffic answer comes
      # from real-traffic-rollout-readiness.yml, which reads production and does not
      # seed anything.
      - name: Apply Postgres schema
        run: |
          for file in backend/migrations/neon/*.sql; do
            echo "applying $file"
            psql "$SUPABASE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Seed deterministic ML release gate fixture
        run: python backend/scripts/seed_release_ml_gate_fixture.py --days 14 --reset

      - name: Run parity gate machinery against the simulated fixture
        run: python backend/scripts/check_real_traffic_rollout_readiness.py --days 14 --traffic-type simulated --fail-on-not-ready

      - name: Run champion/challenger gate against the simulated fixture
        run: python backend/scripts/check_champion_challenger_gate.py --days 14 --traffic-type simulated --fail-on-not-ready

      - name: Run DS operating-loop gate against the simulated fixture
        run: python backend/scripts/check_ds_release_gates.py --lookback-days 14 --traffic-type simulated --fail-on-not-ready

      - name: Run recommendation quality gate
        run: python backend/scripts/check_recommendation_quality_gate.py --ranking-mode semantic --fail-on-not-ready

      - name: Run assistant quality gate
        run: python backend/benchmarks/run_assistant_quality_eval.py --fail-on-regression

      - name: Upload release ML gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-blocking-ml-gates
          path: |
            backend/benchmarks/real_traffic_rollout_readiness.json
            docs/portfolio/real_traffic_rollout_readiness.md
            backend/benchmarks/champion_challenger_gate.json
            docs/portfolio/champion_challenger_gate.md
            backend/benchmarks/ds_release_gates.json
            backend/benchmarks/recommendation_quality_gate.json
            backend/benchmarks/assistant_quality_eval.json
          if-no-files-found: ignore
